name: build-iso

# Builds a live ISO that installs craftos-desktop from the CraftOS apt repo.
# Triggered by publish-repo after each repo update, or by hand. Not on push: a
# push would build against the previously published repo.
# Runs in a Debian 12 container so live-build matches the target release
# (the Ubuntu runner's live-build is too old for these options).
on:
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap ca-certificates gnupg

      - name: Build ISO
        run: |
          chmod +x auto/*
          sh auto/config
          sh auto/build

      - uses: actions/upload-artifact@v4
        with:
          name: craftos-iso
          path: "*.iso"
