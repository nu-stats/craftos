name: publish-repo

# Rebuild and publish the apt repo when a Craft app releases (that app's
# release workflow sends repository_dispatch type "app-release"), monthly as
# a fallback, or on demand. Installed systems then pick it up with apt.
on:
  repository_dispatch:
    types: [app-release]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y reprepro dpkg-dev gnupg gh

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build packages and fetch app .debs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh scripts/fetch-apps.sh
          sh scripts/build-trial-debs.sh
          sh scripts/build-extension-debs.sh
          sh scripts/build-grub-btrfs.sh
          sh scripts/build-meta.sh

      - name: Publish signed repo
        run: sh scripts/publish-repo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo/public

      - id: deploy
        uses: actions/deploy-pages@v4

  # A fresh ISO whenever the repo changes.
  iso:
    needs: publish
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'build-iso.yml', ref: context.ref
            })
